name: Refresh seating

# Weekly (of the three data cadences: programs yearly, courses per-term, seating
# weekly). Seats-only — re-fetches Open Data section enrollment for the pinned
# term and patches just `sections` into the committed snapshot. Seat counts
# drift week to week; ratings/prose/requisites only change on the order of a
# term and are handled by refresh-courses.yml.
#
# Commits any diff directly to main using the built-in GITHUB_TOKEN (no PR).
# NOTE: if main has branch protection requiring PRs/reviews, the push will be
# rejected — either exempt github-actions or switch back to a PR step.

on:
  schedule:
    # 07:00 UTC ≈ 03:00 ET on Sundays — off-peak for UW Open Data.
    - cron: "0 7 * * 0"
  workflow_dispatch:

# All three snapshot-writing refreshes commit to main, so overlapping runs (a
# term-boundary date landing on a seating Sunday) would race the push. Shared
# group serializes them repo-wide; don't cancel an in-progress commit.
concurrency:
  group: data-snapshot-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials:false keeps the write-scoped token out of .git/config
      # so install/fetch steps can't read it; the commit step re-auths to push.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Seats-only requires UW_OPENDATA_KEY (there's nothing else to refresh).
      # Add it as a repo secret: Settings → Secrets and variables → Actions.
      - run: pnpm refresh-seats
        env:
          UW_OPENDATA_KEY: ${{ secrets.UW_OPENDATA_KEY }}
      - name: Commit refreshed seating to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No changes — seating snapshot is already up to date."
          else
            git commit -m "chore(data): refresh seating snapshot"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
          fi
