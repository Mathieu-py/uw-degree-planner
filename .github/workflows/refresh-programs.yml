name: Refresh program requirements

# Yearly (of the three data cadences: programs yearly, courses per-term, seating
# weekly). Program requirements track the undergraduate calendar, which is
# republished about once a year, so a single scheduled run catches the new
# calendar; workflow_dispatch covers the occasional mid-year correction.
# The scraped programs are whatever scripts/scrape-programs.ts targets.
#
# Commits any diff directly to main using the built-in GITHUB_TOKEN (no PR).
# NOTE: if main has branch protection requiring PRs/reviews, the push will be
# rejected — either exempt github-actions or switch back to a PR step.

on:
  schedule:
    # 07:00 UTC on Jun 1 — after the new academic-year calendar is typically
    # published, before fall-term planning ramps up. Adjust if UW shifts.
    - cron: "0 7 1 6 *"
  workflow_dispatch:

# All three snapshot-writing refreshes commit to main, so overlapping runs (a
# term-boundary date landing on a seating Sunday) would race the push. Shared
# group serializes them repo-wide; don't cancel an in-progress commit.
concurrency:
  group: data-snapshot-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials:false keeps the write-scoped token out of .git/config
      # so install/fetch steps can't read it; the commit step re-auths to push.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scrape-programs
      - name: Commit refreshed snapshot to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programs.json
          if git diff --staged --quiet; then
            echo "No changes — program requirements snapshot is already up to date."
          else
            git commit -m "chore(data): refresh program requirements snapshot"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
          fi
