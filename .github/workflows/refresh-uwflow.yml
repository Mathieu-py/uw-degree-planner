name: Refresh UWFlow data

# Re-fetches the active term's course snapshot from UWFlow and opens a PR with
# any diff in data/*.json. Ratings and (especially) section enrollment counts
# drift over time, so a weekly refresh keeps the committed snapshot within ~7d
# of truth. The active term is whatever scripts/fetch-uwflow.ts defaults to,
# i.e. PINNED_TERM in lib/terms.ts — no term config lives here.
#
# Commits any diff directly to main using the built-in GITHUB_TOKEN (no PR).
# NOTE: if main has branch protection requiring PRs/reviews, the push will be
# rejected — either exempt github-actions or switch back to a PR step.

on:
  schedule:
    # 07:00 UTC ≈ 03:00 ET on Sundays — off-peak for the community-run UWFlow endpoint.
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Seating comes from UW Open Data, which needs UW_OPENDATA_KEY. Add it as a
      # repo secret (Settings → Secrets and variables → Actions). If it's absent,
      # build-catalog degrades to a partial refresh (keeps last-known seating)
      # rather than failing — see scripts/build-catalog.ts (#120).
      - run: pnpm fetch-courses
        env:
          UW_OPENDATA_KEY: ${{ secrets.UW_OPENDATA_KEY }}
      # Advisory: flag catalog subjects the SUBJECT_FACULTY map doesn't classify
      # (a new subject arrives with this refresh). Exits 0 and writes to the job
      # summary — a mid-term subject addition must not fail the refresh (#122).
      - run: pnpm check-subjects
      - name: Commit refreshed snapshot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No changes — UWFlow snapshot is already up to date."
          else
            git commit -m "chore(data): refresh UWFlow snapshot"
            git push
          fi
