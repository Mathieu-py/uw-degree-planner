name: Refresh courses

# Per-term (of the three data cadences: programs yearly, courses per-term,
# seating weekly). Full rebuild — UWFlow ratings/prose + Kuali units/requisites
# + Open Data seating — for the pinned term. Ratings and requisites change on
# the order of a term (UW's three terms are ~4 months each), so this runs every
# four months. Bumping to a new term is a separate deliberate code change
# (PINNED_TERM in lib/terms.ts); this refreshes whatever term is pinned.
#
# Commits any diff directly to main using the built-in GITHUB_TOKEN (no PR).
# NOTE: if main has branch protection requiring PRs/reviews, the push will be
# rejected — either exempt github-actions or switch back to a PR step.

on:
  schedule:
    # 07:00 UTC on the 1st of Jan / May / Sep — near each term boundary.
    - cron: "0 7 1 1,5,9 *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # UW_OPENDATA_KEY (repo secret) supplies seating; without it the rebuild
      # degrades to keeping last-known seating rather than failing.
      - run: pnpm fetch-courses
        env:
          UW_OPENDATA_KEY: ${{ secrets.UW_OPENDATA_KEY }}
      # Advisory: flag catalog subjects the SUBJECT_FACULTY map doesn't classify
      # (a new subject can arrive with a full rebuild). Exits 0 and writes to the
      # job summary — a new subject must not fail the refresh.
      - run: pnpm check-subjects
      - name: Commit refreshed courses to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No changes — course snapshot is already up to date."
          else
            git commit -m "chore(data): refresh course snapshot"
            git push
          fi
