# Version-update PRs only — Dependabot *alerts* are a repository setting,
# enabled separately. Weekly cadence with small PR caps to keep noise low.
version: 2
updates:
  # npm ecosystem covers pnpm (pnpm-lock.yaml at the repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
